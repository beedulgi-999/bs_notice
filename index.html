<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부설고 알리미</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <!-- 상단 헤더 -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> 부설고 알리미
            </h1>
            <div id="auth-section" class="flex items-center gap-2">
                <!-- 로그인 상태 표시 영역 -->
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6">
        <!-- 로그인 필요 안내 -->
        <div id="login-notice" class="bg-white rounded-xl shadow-sm p-8 text-center my-8">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">학교 계정 로그인이 필요합니다</h2>
            <p class="text-slate-500 mb-6 text-sm">부설고등학교 계정(<b>@buseol.kr</b>)으로 로그인 후 공지사항을 확인하세요.</p>
            <button id="btn-login" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-lg transition-all shadow-md inline-flex items-center gap-2">
                <i class="fa-brands fa-google"></i> Google 계정으로 로그인
            </button>
        </div>

        <!-- 메인 콘텐츠 (로그인 시 표시) -->
        <div id="main-content" class="hidden space-y-6">
            <!-- 모드 전환 & 검색바 -->
            <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col sm:flex-row justify-between items-center gap-3">
                <!-- 검색창 -->
                <div class="relative w-full sm:w-72">
                    <input type="text" id="search-input" placeholder="제목, 내용, 작성자 검색..." class="w-full pl-9 pr-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                </div>
                <!-- 역할 전환 버튼 -->
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <span id="role-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">학생 모드</span>
                    <button id="btn-switch-role" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-lg hover:bg-slate-700 transition">
                        교직원 모드로 변경
                    </button>
                </div>
            </div>

            <!-- 공지사항 작성 폼 -->
            <div id="notice-form-card" class="bg-white p-5 rounded-xl shadow-sm space-y-3">
                <h3 class="font-bold text-slate-700 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 새 공지사항 작성
                </h3>
                <input type="text" id="notice-title" placeholder="제목을 입력하세요" class="w-full p-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <textarea id="notice-content" rows="3" placeholder="내용을 작성하세요" class="w-full p-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                
                <div class="flex justify-between items-center pt-1">
                    <!-- 교직원전용 필독 옵션 -->
                    <div id="staff-options" class="hidden flex items-center gap-2">
                        <label class="flex items-center gap-1.5 text-xs text-red-600 font-bold cursor-pointer">
                            <input type="checkbox" id="is-important" class="rounded text-red-600 focus:ring-red-500">
                            <i class="fa-solid fa-circle-exclamation"></i> [필독/중요] 공지로 등록
                        </label>
                    </div>
                    <div class="text-xs text-slate-400" id="form-author-info"></div>
                    <button id="btn-submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                        공지 등록
                    </button>
                </div>
            </div>

            <!-- 공지 목록 -->
            <div id="notice-list" class="space-y-4">
                <!-- 카드들이 여기에 동적으로 들어옴 -->
            </div>
        </div>
    </main>

    <!-- 교직원 비밀번호 인증 모달 -->
    <div id="pin-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full space-y-4">
            <h3 class="font-bold text-slate-800 text-lg">교직원 인증</h3>
            <p class="text-xs text-slate-500">교직원 모드로 전환하려면 비밀번호 4자리를 입력하세요.</p>
            <input type="password" id="pin-input" maxlength="4" placeholder="비밀번호 입력" class="w-full text-center tracking-widest text-2xl p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex gap-2">
                <button id="btn-pin-cancel" class="w-1/2 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold">취소</button>
                <button id="btn-pin-submit" class="w-1/2 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold">확인</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 및 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJPuGeyVJ7AdZvflhCwM_MCFsI7Dnp35c",
            authDomain: "bs-nt-af44b.firebaseapp.com",
            projectId: "bs-nt-af44b",
            storageBucket: "bs-nt-af44b.appspot.com",
            messagingSenderId: "1083944634289",
            appId: "1:1083944634289:web:355ba48dc4ee9f090b8332"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let isStaff = false;
        let allNotices = [];
        let isLoggingIn = false; // 중복 로그인 방지 플래그

        const loginNotice = document.getElementById('login-notice');
        const mainContent = document.getElementById('main-content');
        const authSection = document.getElementById('auth-section');
        const roleBadge = document.getElementById('role-badge');
        const btnSwitchRole = document.getElementById('btn-switch-role');
        const staffOptions = document.getElementById('staff-options');
        const pinModal = document.getElementById('pin-modal');
        const searchInput = document.getElementById('search-input');
        const btnLogin = document.getElementById('btn-login');

        // 안전한 구글 팝업 로그인
        btnLogin.addEventListener('click', async () => {
            if (isLoggingIn) return;
            isLoggingIn = true;
            btnLogin.disabled = true;
            btnLogin.opacity = "0.6";

            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                    alert("로그인 중 에러가 발생했습니다: " + err.message);
                }
            } finally {
                isLoggingIn = false;
                btnLogin.disabled = false;
                btnLogin.opacity = "1";
            }
        });

        // 인증 상태 변경 감지
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (!user.email.endsWith('@buseol.kr')) {
                    alert("부설고 학교 계정(@buseol.kr)으로만 접속할 수 있습니다.");
                    signOut(auth);
                    return;
                }
                currentUser = user;
                showLoggedInUI();
                loadNotices();
            } else {
                currentUser = null;
                showLoggedOutUI();
            }
        });

        function showLoggedInUI() {
            loginNotice.classList.add('hidden');
            mainContent.classList.remove('hidden');
            authSection.innerHTML = `
                <span class="text-xs font-medium mr-1 hidden sm:inline">${currentUser.displayName}님</span>
                <button id="btn-logout" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg transition">로그아웃</button>
            `;
            document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
            document.getElementById('form-author-info').textContent = `작성자: ${currentUser.displayName}`;
        }

        function showLoggedOutUI() {
            loginNotice.classList.remove('hidden');
            mainContent.classList.add('hidden');
            authSection.innerHTML = '';
        }

        // 비밀번호(6939) 교직원 인증
        btnSwitchRole.addEventListener('click', () => {
            if (isStaff) {
                isStaff = false;
                updateRoleUI();
            } else {
                pinModal.classList.remove('hidden');
                document.getElementById('pin-input').focus();
            }
        });

        document.getElementById('btn-pin-cancel').addEventListener('click', () => {
            pinModal.classList.add('hidden');
            document.getElementById('pin-input').value = '';
        });

        document.getElementById('btn-pin-submit').addEventListener('click', checkPin);
        document.getElementById('pin-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPin();
        });

        function checkPin() {
            const pin = document.getElementById('pin-input').value;
            if (pin === '6939') {
                isStaff = true;
                pinModal.classList.add('hidden');
                document.getElementById('pin-input').value = '';
                updateRoleUI();
            } else {
                alert('비밀번호가 올바르지 않습니다.');
                document.getElementById('pin-input').value = '';
            }
        }

        function updateRoleUI() {
            if (isStaff) {
                roleBadge.textContent = '교직원 모드';
                roleBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700';
                btnSwitchRole.textContent = '학생 모드로 변경';
                staffOptions.classList.remove('hidden');
            } else {
                roleBadge.textContent = '학생 모드';
                roleBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700';
                btnSwitchRole.textContent = '교직원 모드로 변경';
                staffOptions.classList.add('hidden');
            }
            renderNotices();
        }

        // 공지 등록
        document.getElementById('btn-submit').addEventListener('click', async () => {
            const title = document.getElementById('notice-title').value.trim();
            const content = document.getElementById('notice-content').value.trim();
            const isImportant = isStaff && document.getElementById('is-important').checked;

            if (!title || !content) {
                alert('제목과 내용을 모두 입력해주세요.');
                return;
            }

            try {
                await addDoc(collection(db, 'notices'), {
                    title,
                    content,
                    authorName: currentUser.displayName,
                    authorUid: currentUser.uid,
                    authorRole: isStaff ? '교직원' : '학생',
                    isImportant,
                    createdAt: serverTimestamp()
                });
                document.getElementById('notice-title').value = '';
                document.getElementById('notice-content').value = '';
                if (document.getElementById('is-important')) document.getElementById('is-important').checked = false;
            } catch (err) {
                alert('공지 등록 실패: ' + err.message);
            }
        });

        // 실시간 로딩
        function loadNotices() {
            const q = query(collection(db, 'notices'), orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                allNotices = [];
                snapshot.forEach((doc) => {
                    allNotices.push({ id: doc.id, ...doc.data() });
                });
                renderNotices();
            });
        }

        searchInput.addEventListener('input', renderNotices);

        function renderNotices() {
            const noticeList = document.getElementById('notice-list');
            const keyword = searchInput.value.toLowerCase().trim();

            noticeList.innerHTML = '';

            const filtered = allNotices.filter(item => 
                item.title?.toLowerCase().includes(keyword) ||
                item.content?.toLowerCase().includes(keyword) ||
                item.authorName?.toLowerCase().includes(keyword)
            );

            if (filtered.length === 0) {
                noticeList.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">등록된 공지사항이 없거나 검색 결과가 없습니다.</div>';
                return;
            }

            filtered.forEach(item => {
                const isMyPost = currentUser && item.authorUid === currentUser.uid;
                const canDelete = isStaff || isMyPost;

                let dateStr = '방금 전';
                if (item.createdAt) {
                    const date = item.createdAt.toDate();
                    dateStr = date.toLocaleDateString('ko-KR', {
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit'
                    });
                }

                const card = document.createElement('div');
                card.className = `bg-white p-5 rounded-xl shadow-sm border-l-4 ${item.isImportant ? 'border-red-500 bg-red-50/30' : 'border-indigo-500'} space-y-2 relative`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                ${item.isImportant ? '<span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">필독</span>' : ''}
                                <span class="text-xs px-2 py-0.5 rounded-full font-bold ${item.authorRole === '교직원' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                                    ${item.authorRole || '학생'}
                                </span>
                                <h4 class="font-bold text-slate-800 text-base">${item.title}</h4>
                            </div>
                            <div class="text-xs text-slate-400 flex items-center gap-2">
                                <span><i class="fa-regular fa-user"></i> ${item.authorName}</span>
                                <span>•</span>
                                <span><i class="fa-regular fa-clock"></i> ${dateStr}</span>
                            </div>
                        </div>
                        ${canDelete ? `<button class="btn-delete text-slate-400 hover:text-red-500 p-1 text-sm transition" data-id="${item.id}"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                    </div>
                    <p class="text-slate-600 text-sm whitespace-pre-wrap pt-1">${item.content}</p>
                `;

                noticeList.appendChild(card);
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.dataset.id;
                    if (confirm('정말 이 공지글을 삭제하시겠습니까?')) {
                        await deleteDoc(doc(db, 'notices', id));
                    }
                });
            });
        }
    </script>
</body>
</html>
