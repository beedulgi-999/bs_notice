<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부설고등학교 통합 알리미</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-effect { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .dark .glass-effect { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
    <div id="app" class="pb-20">

        <!-- 1. 로그인 전 화면 -->
        <div v-if="!user" class="min-h-screen flex items-center justify-center p-4">
            <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-3xl p-8 border border-slate-200 dark:border-slate-700 shadow-xl text-center space-y-6">
                <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-amber-500 to-emerald-500 mx-auto flex items-center justify-center text-white text-3xl font-black shadow-lg shadow-emerald-500/20">
                    부
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">부설고 알리미</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">학교 공지사항 및 분실물 센터 실시간 확인 서비스</p>
                </div>

                <div class="pt-4">
                    <button @click="loginWithGoogle" class="w-full py-3.5 px-4 bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600 border border-slate-300 dark:border-slate-600 rounded-2xl font-semibold text-sm text-slate-700 dark:text-slate-200 shadow-sm flex items-center justify-center gap-3 transition">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span>Google 계정으로 로그인</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. 로그인 후 메인 화면 -->
        <template v-else>
            <header class="sticky top-0 z-30 glass-effect border-b border-slate-200 dark:border-slate-800 transition-colors">
                <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white font-black text-xl shadow-md shadow-emerald-500/20">
                            부
                        </div>
                        <div>
                            <h1 class="text-lg font-bold leading-tight flex items-center gap-2">
                                부설고 알리미
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300">
                                    Firebase
                                </span>
                            </h1>
                            <p class="text-xs text-slate-500 dark:text-slate-400">실시간 통합 공지 게시판</p>
                        </div>
                    </div>

                    <!-- 유저 정보 및 제어 버튼 -->
                    <div class="flex items-center gap-2 sm:gap-3">
                        <!-- 로그인 유저 프로필 -->
                        <div class="hidden md:flex items-center gap-2 bg-slate-100 dark:bg-slate-800 p-1.5 pr-3 rounded-xl border border-slate-200 dark:border-slate-700">
                            <img :src="user.photoURL || 'https://placehold.co/100x100?text=User'" class="w-7 h-7 rounded-lg object-cover">
                            <div class="text-left leading-tight">
                                <div class="text-xs font-bold">{{ user.displayName }}</div>
                                <div class="text-[10px] text-slate-400">{{ user.email }}</div>
                            </div>
                        </div>

                        <!-- 교직원/학생 모드 -->
                        <button @click="isTeacher = !isTeacher" class="px-3 py-1.5 rounded-xl border text-xs font-semibold flex items-center gap-2 transition-all"
                            :class="isTeacher ? 'border-amber-500 bg-amber-50 dark:bg-amber-950/30 text-amber-700 dark:text-amber-300' : 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300'">
                            <i :class="isTeacher ? 'fa-solid fa-user-shield text-amber-500' : 'fa-solid fa-graduation-cap text-indigo-500'"></i>
                            <span>{{ isTeacher ? '교직원 모드' : '학생 모드' }}</span>
                        </button>

                        <!-- 다크 모드 토글 -->
                        <button @click="toggleDarkMode" class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 transition">
                            <i :class="isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon'"></i>
                        </button>

                        <!-- 로그아웃 버튼 -->
                        <button @click="logout" class="px-3 py-1.5 rounded-xl border border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400 text-xs font-bold flex items-center gap-1.5 hover:bg-red-100 transition">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span class="hidden sm:inline">로그아웃</span>
                        </button>

                        <!-- 글쓰기 버튼 -->
                        <button @click="showCreateModal = true" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-md shadow-emerald-600/30 transition">
                            <i class="fa-solid fa-plus"></i>
                            <span class="hidden sm:inline">글쓰기</span>
                        </button>
                    </div>
                </div>
            </header>

            <main class="max-w-6xl mx-auto px-4 mt-6">
                <!-- 탭 메뉴 -->
                <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-6 hide-scrollbar border-b border-slate-200 dark:border-slate-800">
                    <button @click="currentTab = 'all'" 
                        class="px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition flex items-center gap-2"
                        :class="currentTab === 'all' ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>전체 모아보기</span>
                    </button>

                    <button v-for="room in rooms" :key="room.id" @click="currentTab = room.id"
                        class="px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition flex items-center gap-2"
                        :class="currentTab === room.id ? room.activeClass : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'">
                        <i :class="room.icon"></i>
                        <span>{{ room.name }}</span>
                    </button>
                </div>

                <!-- 분실물 안내 문구 -->
                <div v-if="currentTab === 'lost'" class="mb-4 p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-800 dark:text-amber-200 text-xs leading-relaxed">
                    <i class="fa-solid fa-circle-info mr-1"></i>
                    분실물을 발견했거나 잃어버린 물건이 있다면 이 공지방에 올려 주세요. 습득한 분실물은 담당층 학년실에 가져다주시기 바랍니다.
                </div>

                <!-- 로딩 표시 -->
                <div v-if="loading" class="text-center py-16">
                    <div class="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                    <p class="text-xs text-slate-400">Firebase 실시간 데이터 불러오는 중...</p>
                </div>

                <!-- 데이터 없음 -->
                <div v-else-if="filteredNotices.length === 0" class="text-center py-16 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                    <p class="text-sm font-bold text-slate-500">등록된 공지사항이 없습니다.</p>
                </div>

                <!-- 공지 리스트 -->
                <div v-else class="space-y-3">
                    <div v-for="notice in filteredNotices" :key="notice.id"
                        class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 hover:border-emerald-500 shadow-sm transition flex justify-between items-start gap-4">
                        <div class="space-y-1.5 flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300">
                                    {{ getRoomName(notice.room_id) }}
                                </span>
                                <span v-if="notice.category" class="px-2 py-0.5 rounded text-[10px] bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                                    {{ notice.category }}
                                </span>
                            </div>
                            <h3 class="font-bold text-base text-slate-900 dark:text-slate-100">{{ notice.title }}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed">{{ notice.content }}</p>

                            <!-- 물건 특징 (분실물인 경우) -->
                            <div v-if="notice.item_features" class="mt-2 pt-2 border-t border-slate-100 dark:border-slate-700/50 flex items-center gap-1.5 text-xs text-amber-600 dark:text-amber-400">
                                <i class="fa-solid fa-tags"></i>
                                <span class="font-semibold">물건 특징:</span> {{ notice.item_features }}
                            </div>
                        </div>
                        <div class="text-right text-xs text-slate-400 whitespace-nowrap">
                            <div class="font-semibold text-slate-600 dark:text-slate-300">{{ notice.author }}</div>
                            <div>{{ notice.date }}</div>
                        </div>
                    </div>
                </div>
            </main>

            <div v-if="showCreateModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-xl w-full p-6 space-y-4 border border-slate-200 dark:border-slate-700">
                    <h3 class="text-lg font-bold">새 공지 등록</h3>
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block font-bold mb-1">게시판 선택</label>
                            <select v-model="formNotice.roomId" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                                <option value="general">전체 공지방</option>
                                <option value="1grade">1학년 공지방</option>
                                <option value="2grade">2학년 공지방</option>
                                <option value="3grade">3학년 공지방</option>
                                <option value="lost">분실물 공지방</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">제목</label>
                            <input v-model="formNotice.title" type="text" placeholder="제목을 입력하세요" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        </div>
                        <div v-if="formNotice.roomId === 'lost'">
                            <label class="block font-bold mb-1">물건 특징 (색, 브랜드, 모양/종류, 눈에 띄는 특징)</label>
                            <input v-model="formNotice.itemFeatures" type="text" placeholder="예: 검은색 나이키 패딩, 지퍼에 파란색 키링" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">내용</label>
                            <textarea v-model="formNotice.content" rows="4" placeholder="상세 내용을 입력하세요" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900"></textarea>
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button @click="showCreateModal = false" class="px-4 py-2 rounded-xl text-xs bg-slate-200 dark:bg-slate-700 font-semibold">취소</button>
                        <button @click="submitNewNotice" class="px-4 py-2 rounded-xl text-xs bg-emerald-600 text-white font-bold shadow-md shadow-emerald-600/30">등록하기</button>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 사용자님의 Firebase 실제 설정 키 값
        const firebaseConfig = {
            apiKey: "AIzaSyCJPuGeyVJ7AdZvfIhCwM_MCFsl7Dnp35c",
            authDomain: "bs-nt-af44b.firebaseapp.com",
            projectId: "bs-nt-af44b",
            storageBucket: "bs-nt-af44b.firebasestorage.app",
            messagingSenderId: "479785428425",
            appId: "1:479785428425:web:d632dfc81582ca85e6f418",
            measurementId: "G-G8FX36195B"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    user: null,
                    loading: true,
                    isDark: false,
                    isTeacher: false,
                    currentTab: 'all',
                    showCreateModal: false,

                    rooms: [
                        { id: 'general', name: '전체 공지방', icon: 'fa-solid fa-bullhorn', activeClass: 'bg-emerald-600 text-white' },
                        { id: '1grade', name: '1학년 공지방', icon: 'fa-solid fa-seedling', activeClass: 'bg-emerald-600 text-white' },
                        { id: '2grade', name: '2학년 공지방', icon: 'fa-solid fa-compass', activeClass: 'bg-blue-600 text-white' },
                        { id: '3grade', name: '3학년 공지방', icon: 'fa-solid fa-graduation-cap', activeClass: 'bg-purple-600 text-white' },
                        { id: 'lost', name: '분실물 공지방', icon: 'fa-solid fa-box-open', activeClass: 'bg-amber-600 text-white' },
                    ],

                    formNotice: {
                        roomId: 'general',
                        title: '',
                        content: '',
                        itemFeatures: '',
                        category: '일반'
                    },

                    notices: []
                }
            },

            computed: {
                filteredNotices() {
                    if (this.currentTab === 'all') return this.notices;
                    return this.notices.filter(n => n.room_id === this.currentTab);
                }
            },

            mounted() {
                onAuthStateChanged(auth, (currentUser) => {
                    this.user = currentUser;
                    if (currentUser) {
                        this.subscribeToFirestore();
                    } else {
                        this.loading = false;
                    }
                });
            },

            methods: {
                async loginWithGoogle() {
                    const provider = new GoogleAuthProvider();
                    try {
                        await signInWithPopup(auth, provider);
                    } catch (error) {
                        console.error("로그인 실패:", error);
                        alert("로그인에 실패했습니다: " + error.message);
                    }
                },

                async logout() {
                    try {
                        await signOut(auth);
                        this.notices = [];
                    } catch (error) {
                        console.error("로그아웃 실패:", error);
                    }
                },

                subscribeToFirestore() {
                    this.loading = true;
                    const q = query(collection(db, "notices"), orderBy("created_at", "desc"));

                    onSnapshot(q, (snapshot) => {
                        this.notices = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        this.loading = false;
                    }, (error) => {
                        console.error("Firestore 수신 오류:", error);
                        this.loading = false;
                    });
                },

                async submitNewNotice() {
                    if (!this.formNotice.title || !this.formNotice.content) {
                        alert('제목과 내용을 입력해 주세요.');
                        return;
                    }

                    const today = new Date();
                    const dateStr = `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;

                    try {
                        await addDoc(collection(db, "notices"), {
                            room_id: this.formNotice.roomId,
                            title: this.formNotice.title,
                            content: this.formNotice.content,
                            item_features: this.formNotice.roomId === 'lost' ? this.formNotice.itemFeatures : '',
                            category: this.formNotice.category,
                            author: this.user ? this.user.displayName : (this.isTeacher ? '교직원' : '학생'),
                            author_email: this.user ? this.user.email : '',
                            date: dateStr,
                            created_at: serverTimestamp()
                        });

                        this.showCreateModal = false;
                        this.formNotice.title = '';
                        this.formNotice.content = '';
                        this.formNotice.itemFeatures = '';
                    } catch (error) {
                        console.error("공지 등록 실패:", error);
                        alert("글 등록 실패: " + error.message);
                    }
                },

                getRoomName(roomId) {
                    const room = this.rooms.find(r => r.id === roomId);
                    return room ? room.name : '전체 공지';
                },

                toggleDarkMode() {
                    this.isDark = !this.isDark;
                    document.documentElement.classList.toggle('dark', this.isDark);
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
